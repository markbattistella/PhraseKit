name: Validate and Merge Pull Request

on:
  pull_request:
    types: [opened, synchronize]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-22.04
    if: contains(github.event.pull_request.labels.*.name, 'mb-cli')

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get GitHub App user ID
        id: app-user
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "id=${user_id}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Validation Script
        id: validation
        run: |
          node ./.github/scripts/validation.js ./Sources/PhraseKit/Resources pending

      - name: Commit Changes
        if: success()
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update JSON files after validation"
          git pull origin ${{ github.event.pull_request.head.ref }} --rebase
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
        
      - name: Merge Pull Request
        if: success()
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --delete-branch --merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update PR (Success)
        if: success()
        uses: actions/github-script@v4
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const outputPath = 'validation_output.txt';
            let output = '';
            if (fs.existsSync(outputPath)) {
              output = fs.readFileSync(outputPath, 'utf8');
            } else {
              output = 'No output generated from validation.';
            }
            github.pulls.createReview({
              pull_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Word validation was successful with the following details:\n\`\`\`\n${output}\n\`\`\`\n`,
              event: "COMMENT"
            });

      - name: Update PR (Failure)
        if: failure()
        uses: actions/github-script@v4
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            github.pulls.createReview({
              pull_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Validation failed. Please check the details and make necessary changes.`,
              event: "REQUEST_CHANGES"
            });

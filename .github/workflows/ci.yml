name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: macOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  simulator:
    name: iOS Simulator
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build \
            --sdk "$SDKROOT" \
            --triple arm64-apple-ios12.0-simulator
